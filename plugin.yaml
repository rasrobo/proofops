name: proofops
version: "0.7.1"
description: "Verification for completion claims. Hermes runs a declared plan of read-only checks against a target and gets a receipt: what passed, what was actually observed, and — printed on every receipt — what passing does not prove. Refuses to run a command the plan never declared or the operator never listed, and permits no file reads at all until the operator sets plugins.entries.proofops.settings.allowed_paths. No telemetry by default; with an explicit opt-in it sends anonymous diagnostics (nine counters the operator can print byte for byte first) that decide which check types get fixed next."
author: "Side Quest Studios"
license: "MIT"
requires_hermes: ">=0.21.5"
provides_tools:
  - proofops_plans
  - proofops_run
  - proofops_receipt
  - proofops_verify
tags:
  - verification
  - testing
  - deployment
  - evidence
  - receipts
